<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Tumbuddy_ID</title>
  <style>
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #5B0E1E; color: #FBF4EA;
      font-family: system-ui, -apple-system, "Segoe UI", Arial, sans-serif; text-align: center; }
    img { width: 150px; height: auto; margin: 0 auto 18px; display: block; }
    p { margin: 0 0 14px; font-size: 16px; }
    a { color: #F6C9CF; font-weight: 600; }
    .dots span { display: inline-block; width: 8px; height: 8px; margin: 0 3px; border-radius: 50%; background: #F6C9CF; animation: b 1s infinite ease-in-out; }
    .dots span:nth-child(2) { animation-delay: .15s; } .dots span:nth-child(3) { animation-delay: .3s; }
    @keyframes b { 50% { transform: translateY(-6px); opacity: .5; } }
  </style>
  <script>
    window.va = window.va || function () { (window.vaq = window.vaq || []).push(arguments); };
  </script>
  <script defer src="/_vercel/insights/script.js"></script>
  <script src="/data.js"></script>
</head>
<body>
  <div>
    <img src="/logo.png" alt="Tumbuddy_ID">
    <p id="msg">Sebentar ya, sedang membuka WhatsApp</p>
    <div class="dots"><span></span><span></span><span></span></div>
    <p style="margin-top:22px;font-size:14px">Tidak terbuka otomatis? <a id="go" href="#">Klik di sini</a></p>
  </div>
  <script>
    var slug = location.pathname.split("/").filter(Boolean).pop() || "";
    var dest = tujuanKlik(slug);
    var nama = { instagram: "Instagram", youtube: "YouTube", tiktok: "TikTok" }[slug];
    if (nama) document.getElementById("msg").textContent = "Sebentar ya, sedang membuka " + nama;
    document.getElementById("go").href = dest;
    // jeda singkat supaya kunjungan sempat tercatat sebelum pindah
    setTimeout(function () { location.replace(dest); }, 700);
  </script>
</body>
</html>
